<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ARR Activity Waterfall — Sigma Plugin</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:transparent;color:#1a2230;overflow:hidden}
  #wrap{height:100%;width:100%;display:flex;flex-direction:column;padding:12px 14px}
  #ttl{font-size:15px;font-weight:600}
  #sub{font-size:11px;color:#8a94a6;margin-bottom:4px}
  #chart{flex:1;width:100%}
  svg{width:100%;height:100%;display:block}
  .bl{font-size:11px;fill:#5a6474;font-weight:500}
  .vl{font-size:11px;font-weight:600}
  .ax{stroke:#e6e9ef;stroke-width:1}
  .axt{font-size:10px;fill:#a4acbb}
  .cn{stroke:#c7ccd6;stroke-width:1.5;stroke-dasharray:3 3}
</style>
</head>
<body>
<div id="wrap">
  <div id="ttl">ARR Activity Waterfall</div>
  <div id="sub"></div>
  <div id="chart"><svg id="svg" preserveAspectRatio="xMidYMid meet"></svg></div>
</div>
<script>
(function(){
  var client=(window.sigmaComputing&&window.sigmaComputing.plugin&&window.sigmaComputing.plugin.client)||null;
  var defs=[
    {name:'source',type:'element'},
    {name:'label',type:'column',source:'source',allowMultiple:false,label:'Activity'},
    {name:'value',type:'column',source:'source',allowMultiple:false,allowedTypes:['number','integer'],label:'Variance (delta)'},
    {name:'anchor',type:'element',label:'Anchor element'},
    {name:'beginning',type:'column',source:'anchor',allowMultiple:false,allowedTypes:['number','integer'],label:'Beginning ARR'},
    {name:'ending',type:'column',source:'anchor',allowMultiple:false,allowedTypes:['number','integer'],label:'Ending ARR'},
    {name:'title',type:'text',label:'Title',defaultValue:'ARR Activity Waterfall'}
  ];
  if(client) client.config.configureEditorPanel(defs);

  var ORDER=['New','Expansion','Downsell','Churn'];
  function fmtM(v){ if(v==null||isNaN(v))return '—'; var a=Math.abs(v);
    var s=a>=1e9?(v/1e9).toFixed(2)+'B':a>=1e6?(v/1e6).toFixed(1)+'M':a>=1e3?(v/1e3).toFixed(0)+'K':Math.round(v).toString();
    return (v<0?'-$':'$')+s.replace('-','');}
  function isArr(x){return Object.prototype.toString.call(x)==='[object Array]';}
  function nums(a){return (a||[]).map(Number).filter(function(x){return !isNaN(x);});}
  function sum(a){return nums(a).reduce(function(x,y){return x+y;},0);}
  // find the text-array column and numeric-array columns in a data object
  function textCol(d){for(var k in d){var a=d[k]; if(isArr(a)&&a.length&&a.some(function(v){return typeof v==='string';})) return k;} return null;}
  function numCols(d){var r=[];for(var k in d){var a=d[k]; if(isArr(a)&&a.length&&a.every(function(v){return v===null||!isNaN(Number(v));})) r.push(k);} return r;}

  function render(cfg,beginning,ending,deltas,live){
    document.getElementById('ttl').textContent=(cfg&&cfg.title)||'ARR Activity Waterfall';
    document.getElementById('sub').textContent=(live?'':'PREVIEW · ')+'Comparison '+fmtM(beginning)+' → Ending '+fmtM(ending)+'  (net '+fmtM(ending-beginning)+')';
    var cats=[{label:'Comparison ARR',type:'total',value:beginning}];
    ORDER.forEach(function(k){ if(deltas[k]!==undefined && Math.round(deltas[k])!==0) cats.push({label:k,type:'delta',value:deltas[k]}); });
    cats.push({label:'Ending ARR',type:'total',value:ending});
    var svg=document.getElementById('svg'),W=svg.clientWidth||760,H=svg.clientHeight||300;
    svg.setAttribute('viewBox','0 0 '+W+' '+H); while(svg.firstChild)svg.removeChild(svg.firstChild);
    var padL=54,padR=14,padT=16,padB=40,iw=W-padL-padR,ih=H-padT-padB,run=0,lo=0,hi=Math.max(beginning,ending);
    cats.forEach(function(c){ if(c.type==='total'){c.y0=0;c.y1=c.value;run=c.value;} else {c.y0=run;c.y1=run+c.value;run=c.y1;} lo=Math.min(lo,c.y0,c.y1);hi=Math.max(hi,c.y0,c.y1);});
    hi*=1.08; lo=lo>0?0:lo*1.08;
    function Y(v){return padT+ih*(1-(v-lo)/(hi-lo));}
    var n=cats.length,gap=14,bw=(iw-gap*(n-1))/n,NS='http://www.w3.org/2000/svg';
    function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    [0,.25,.5,.75,1].forEach(function(f){var v=lo+(hi-lo)*f,y=Y(v);el('line',{x1:padL,y1:y,x2:W-padR,y2:y,class:'ax'});var t=el('text',{x:padL-6,y:y+3,class:'axt','text-anchor':'end'});t.textContent=fmtM(v);});
    var COL={total:'#1f4e79',up:'#1f9d63',down:'#d84a4a'};
    cats.forEach(function(c,i){var x=padL+i*(bw+gap),yT=Y(Math.max(c.y0,c.y1)),yB=Y(Math.min(c.y0,c.y1)),col=c.type==='total'?COL.total:(c.value>=0?COL.up:COL.down);
      el('rect',{x:x,y:yT,width:bw,height:Math.max(2,yB-yT),rx:2,fill:col});
      if(i<n-1){var yc=Y(c.type==='total'?c.value:c.y1);el('line',{x1:x+bw,y1:yc,x2:x+bw+gap,y2:yc,class:'cn'});}
      var vt=el('text',{x:x+bw/2,y:yT-5,class:'vl','text-anchor':'middle',fill:col});vt.textContent=(c.type==='delta'&&c.value>0?'+':'')+fmtM(c.value);
      var lt=el('text',{x:x+bw/2,y:H-padB+16,class:'bl','text-anchor':'middle'});lt.textContent=c.label;});
  }

  var st={cfg:{},src:null,anc:null,uS:null,uA:null};
  function recompute(){
    var c=st.cfg||{};
    if(st.src){
      var lk=(c.label&&st.src[c.label])?c.label:textCol(st.src);
      var vk=(c.value&&st.src[c.value])?c.value:(numCols(st.src)[0]);
      if(lk&&vk&&st.src[lk]&&st.src[vk]){
        var labs=st.src[lk],vals=st.src[vk],d={};
        for(var i=0;i<labs.length;i++){d[labs[i]]=(d[labs[i]]||0)+Number(vals[i]||0);}
        var beg=0,end=0;
        if(st.anc){var ncs=numCols(st.anc);
          beg=(c.beginning&&st.anc[c.beginning])?sum(st.anc[c.beginning]):(ncs[0]?sum(st.anc[ncs[0]]):0);
          end=(c.ending&&st.anc[c.ending])?sum(st.anc[c.ending]):(ncs[1]?sum(st.anc[ncs[1]]):0);
        }
        if(!end){end=beg;ORDER.forEach(function(k){end+=(d[k]||0);});}
        render(c,beg,end,d,true); return;
      }
    }
    render(c,216240846,218521362,{New:2627070,Expansion:11558679,Downsell:-6292599,Churn:-5612633},false);
  }
  if(client){
    client.config.subscribe(function(config){st.cfg=config||{};
      if(st.uS){st.uS();st.uS=null;} if(st.uA){st.uA();st.uA=null;}
      if(config&&config.source)st.uS=client.elements.subscribeToElementData(config.source,function(d){st.src=d;recompute();});
      if(config&&config.anchor)st.uA=client.elements.subscribeToElementData(config.anchor,function(d){st.anc=d;recompute();});
      recompute();
    });
  } else { recompute(); }
  window.addEventListener('resize',recompute);
})();
</script>
</body>
</html>
